name: mockmockk
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://app:localpassword@db:5432/app?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    environment:
      APP_ENV: local
      SERVICE_NAME: ${SERVICE_NAME:-mockmock-service}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://app:localpassword@db:5432/app?sslmode=disable
      SHUTDOWN_TIMEOUT: 10s
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
