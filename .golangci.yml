run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - misspell

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  gosec:
    excludes:
      - G104 # duplicate of errcheck
      - G404 # weak random for diagnostic correlation ID
  revive:
    rules:
      - name: unused-parameter
        disabled: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
